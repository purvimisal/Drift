kind = "web"
previewPath = "/"
title = "Drift"
version = "1.0.0"
id = "artifacts/drift"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19113

[services.development]
run = "pnpm --filter @workspace/drift run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/drift", "run", "build" ]
publicDir = "artifacts/drift/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19113"
BASE_PATH = "/"
