openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Drift - Adaptive Motivation Assistant API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: goals
    description: Goal management
  - name: tasks
    description: Daily task operations
  - name: ai
    description: AI-powered content generation
  - name: Auth
    description: Browser authentication endpoints.
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
        - name: anonSessionId
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      responses:
        '302':
          description: Redirect on success or failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /goals:
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a new goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalBody"
      responses:
        "201":
          description: Goal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
    get:
      operationId: getGoals
      tags: [goals]
      summary: Get all goals
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"

  /goals/{id}:
    get:
      operationId: getGoal
      tags: [goals]
      summary: Get a goal by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Goal found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          description: Goal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Goal deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /goals/{id}/state:
    get:
      operationId: getGoalState
      tags: [goals]
      summary: Get the current state machine status of a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Goal state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalState"

  /goals/{id}/tasks:
    get:
      operationId: getGoalTasks
      tags: [tasks]
      summary: Get all tasks for a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of all tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalTasksResponse"
        "404":
          description: Goal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /goals/{id}/tasks/today:
    get:
      operationId: getTodayTask
      tags: [tasks]
      summary: Get today's task for a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Today's task with adaptive message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayTaskResponse"
        "404":
          description: No task found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /goals/{id}/tasks/{taskId}/action:
    post:
      operationId: recordTaskAction
      tags: [tasks]
      summary: Record an action on a task (done, skip, too_much)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskActionBody"
      responses:
        "200":
          description: Action recorded, returns updated state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskActionResponse"

  /goals/{id}/generate-tasks:
    post:
      operationId: generateTasks
      tags: [ai]
      summary: Generate a task plan using AI for a goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tasks generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateTasksResponse"

  /goals/{id}/message:
    get:
      operationId: getAdaptiveMessage
      tags: [ai]
      summary: Get an adaptive message based on current state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Adaptive message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdaptiveMessage"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    CreateGoalBody:
      type: object
      properties:
        title:
          type: string
          description: The user's goal description
        durationDays:
          type: integer
          description: How many days to work on this goal
          minimum: 1
          maximum: 365
        context:
          type: string
          nullable: true
          description: Optional starting-point context to calibrate the plan
      required:
        - title
        - durationDays

    Goal:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        durationDays:
          type: integer
        state:
          type: string
          enum: [ON_TRACK, DRIFTING, DISENGAGING, AT_RISK, RETURNING]
        missedCount:
          type: integer
        tooMuchFlag:
          type: boolean
        tooMuchCount:
          type: integer
        consecutiveSkips:
          type: integer
        lastCompletedDate:
          type: string
          nullable: true
        lastOpenedAt:
          type: string
          nullable: true
        createdAt:
          type: string
        currentDifficultyMultiplier:
          type: number
      required:
        - id
        - title
        - durationDays
        - state
        - missedCount
        - tooMuchFlag
        - tooMuchCount
        - consecutiveSkips
        - createdAt
        - currentDifficultyMultiplier

    GoalState:
      type: object
      properties:
        goalId:
          type: integer
        state:
          type: string
          enum: [ON_TRACK, DRIFTING, DISENGAGING, AT_RISK, RETURNING]
        missedCount:
          type: integer
        tooMuchFlag:
          type: boolean
        lastCompletedDate:
          type: string
          nullable: true
        message:
          type: string
        difficultyMultiplier:
          type: number
      required:
        - goalId
        - state
        - missedCount
        - tooMuchFlag
        - message
        - difficultyMultiplier

    Task:
      type: object
      properties:
        id:
          type: integer
        goalId:
          type: integer
        dayNumber:
          type: integer
        title:
          type: string
        description:
          type: string
        estimatedMinutes:
          type: integer
        difficultyLevel:
          type: number
        completedAt:
          type: string
          nullable: true
        skippedAt:
          type: string
          nullable: true
        tooMuchAt:
          type: string
          nullable: true
        scheduledFor:
          type: string
      required:
        - id
        - goalId
        - dayNumber
        - title
        - description
        - estimatedMinutes
        - difficultyLevel
        - scheduledFor

    TodayTaskResponse:
      type: object
      properties:
        task:
          $ref: "#/components/schemas/Task"
        goalState:
          type: string
          enum: [ON_TRACK, DRIFTING, DISENGAGING, AT_RISK, RETURNING]
        adaptiveMessage:
          type: string
        goal:
          $ref: "#/components/schemas/Goal"
      required:
        - task
        - goalState
        - adaptiveMessage
        - goal

    TaskActionBody:
      type: object
      properties:
        action:
          type: string
          enum: [done, skip, too_much]
      required:
        - action

    TaskActionResponse:
      type: object
      properties:
        success:
          type: boolean
        newState:
          type: string
          enum: [ON_TRACK, DRIFTING, DISENGAGING, AT_RISK, RETURNING]
        message:
          type: string
        nextTask:
          $ref: "#/components/schemas/Task"
          nullable: true
        adapted:
          type: boolean
        adaptationMessage:
          type: string
          nullable: true
      required:
        - success
        - newState
        - message
        - adapted

    GoalTasksResponse:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        goal:
          $ref: "#/components/schemas/Goal"
      required:
        - tasks
        - goal

    GenerateTasksResponse:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        totalGenerated:
          type: integer
      required:
        - tasks
        - totalGenerated

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']

    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'

    AdaptiveMessage:
      type: object
      properties:
        message:
          type: string
        state:
          type: string
          enum: [ON_TRACK, DRIFTING, DISENGAGING, AT_RISK, RETURNING]
        tone:
          type: string
      required:
        - message
        - state
        - tone
